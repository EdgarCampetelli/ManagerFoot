spring:
  application:
    name: managerFoot

  datasource:
    url: ${DATA_BASE_URL}
    username: ${DATA_BASE_USER}
    password: ${DATA_BASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true;

  flyway:
    enabled: true
